<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{font-family:system-ui,Arial;color:#edf4ff;background:#0b1730}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:860px}h1{margin:0 0 8px}p{color:#a8bad8}label{display:block;margin:14px 0 6px;font-weight:700}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #526685;background:#192944;color:white}.four{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.panel{border:1px solid #33496d;border-radius:16px;background:#152540;padding:20px}button{padding:12px 20px;border-radius:10px;border:0;background:#ffdb75;color:#162039;font-weight:800;cursor:pointer;margin-top:18px}button:disabled{opacity:.5;cursor:wait}#message{white-space:pre-wrap;color:#e8dbaa;margin:16px 0}.tag{color:#f8c75a;font-size:.8rem;font-weight:800}@media(max-width:520px){body{padding:12px}.four{grid-template-columns:1fr}}</style></head><body>
<p class="tag">KEVITU · ADMIN DEV ONLY</p><h1>Pengurusan Mata Acara</h1><p>Terhad kepada akaun Admin yang disahkan oleh GAS. Pilih acara untuk edit atau batal. Semua operasi ini menggunakan spreadsheet DEV sahaja.</p>
<div class="panel" style="margin-bottom:14px"><label for="existing">Pilih acara sedia ada</label><select id="existing"><option value="">+ Acara baharu</option></select><button type="button" id="reload">Refresh Senarai</button><button type="button" id="cancel" style="background:#bd394d;color:white;margin-left:10px" disabled>Batal Acara Dipilih</button></div><form id="scoreForm" class="panel">
<label for="eventName">Nama acara</label><input id="eventName" maxlength="120" required placeholder="Contoh: Bola Jaring">
<label for="eventDate">Tarikh acara</label><input id="eventDate" type="date" required>
<label for="eventStatus">Status</label><select id="eventStatus"><option value="AKTIF">AKTIF</option><option value="SELESAI">SELESAI</option></select>
<div class="four"><div><label for="merah">🔴 Mata Merah</label><input id="merah" type="number" min="0" max="1000000" step="any" required></div><div><label for="biru">🔵 Mata Biru</label><input id="biru" type="number" min="0" max="1000000" step="any" required></div><div><label for="hijau">🟢 Mata Hijau</label><input id="hijau" type="number" min="0" max="1000000" step="any" required></div><div><label for="kuning">🟡 Mata Kuning</label><input id="kuning" type="number" min="0" max="1000000" step="any" required></div></div>
<button id="submit" type="submit">Simpan Acara DEV</button><div id="message" role="status"></div></form>
<script>
const $=id=>document.getElementById(id);
let events=[],busy=false;
function message(t){$('message').textContent=t}
function lock(on){busy=on; $('submit').disabled=on||current()?.status==='BATAL';$('cancel').disabled=on||!$('existing').value||current()?.status==='BATAL';$('reload').disabled=on;$('existing').disabled=on}
function current(){return events.find(e=>e.id_acara===$('existing').value)}
function fill(){const e=current();$('eventName').value=e?.nama_acara||'';$('eventDate').value=e?.tarikh_acara||'';$('eventStatus').value=e?.status==='SELESAI'?'SELESAI':'AKTIF';for(const [key,id] of [['MERAH','merah'],['BIRU','biru'],['HIJAU','hijau'],['KUNING','kuning']])$(id).value=e?.mata?.[key]??'';$('submit').textContent=e?'Kemaskini Mata DEV':'Simpan Acara DEV';$('submit').disabled=e?.status==='BATAL';$('cancel').disabled=!e||e.status==='BATAL';message(e?.status==='BATAL'?'Acara BATAL hanya untuk rujukan.': '')}
function reload(selected){google.script.run.withSuccessHandler(rows=>{events=rows;const sel=$('existing');sel.replaceChildren(new Option('+ Acara baharu',''));rows.forEach(e=>sel.add(new Option(e.id_acara+' · '+e.nama_acara+' ['+e.status+']',e.id_acara)));sel.value=selected||'';fill();lock(false);if(selected&&sel.value!==selected)message('Rekod tidak dijumpai.');}).withFailureHandler(err=>{lock(false);message('Ralat senarai: '+err.message)}).adminListEventsDev()}
$('existing').addEventListener('change',fill);$('reload').addEventListener('click',()=>{lock(true);reload($('existing').value)});
$('scoreForm').addEventListener('submit',e=>{e.preventDefault();if(busy)return;const currentEvent=current();if(currentEvent?.status==='BATAL')return message('Acara BATAL tidak boleh diedit.');const read=id=>$(id).value.trim()===''?null:Number($(id).value);const payload={nama_acara:$('eventName').value,tarikh_acara:$('eventDate').value,status:$('eventStatus').value,catatan:currentEvent?.catatan||'Dicipta dari UI Admin DEV',mata:{MERAH:read('merah'),BIRU:read('biru'),HIJAU:read('hijau'),KUNING:read('kuning')}};if(currentEvent)payload.id_acara=currentEvent.id_acara;lock(true);message('Memproses...');const runner=google.script.run.withSuccessHandler(res=>{message('Berjaya: '+res.id_acara);reload(res.id_acara)}).withFailureHandler(err=>{lock(false);message('Gagal: '+err.message+' — jangan klik dua kali jika operasi belum pasti.')});if(currentEvent)runner.adminEditEventDev(payload);else runner.adminCreateEventFromUi(payload)});
$('cancel').addEventListener('click',()=>{const e=current();if(!e||busy||e.status==='BATAL')return;if(!confirm('BATALKAN '+e.id_acara+'? Mata acara ini akan dikecualikan daripada kedudukan.'))return;lock(true);message('Membatalkan...');google.script.run.withSuccessHandler(()=>{message('BATAL: '+e.id_acara);reload(e.id_acara)}).withFailureHandler(err=>{lock(false);message('Gagal batal: '+err.message)}).adminCancelEventDev(e.id_acara)});
lock(true);reload('');
</script></body></html>
