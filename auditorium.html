ht:900;line-height:1.2}.house .unit{color:#d6e5ff}footer{display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap;color:#c0d2ee;font-size:clamp(12px,1vw,17px)}@media(max-width:850px){#houses{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:440px){#houses{grid-template-columns:1fr}.house{min-height:190px}}
